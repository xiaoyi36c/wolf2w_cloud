spring:
  cache:
    # 缓存类型为 redis
    type: redis
    redis:
      # 设置缓存过期时间/毫秒
      time-to-live: 18000000
      # 是否开启 key 前缀
      use-key-prefix: true
      # 是否缓存空值，防止缓存穿透
      cache-null-values: true
  application:
    name: trip-article-server
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: Bai0514..
      config:
        namespace: 931f842c-27d0-4726-ad3d-a8bdfbdeb902
        file-extension: yaml
        shared-configs:
          - data-id: nacos-dev.yaml
          - data-id: trip-provider-server.yaml
          - data-id: wolfw2-auth-dey.yaml
    gateway:
      discovery:
        locator:
          enabled: true # 让gateway可以发现nacos中的微服务
  profiles:
    active: dev

wolf2w:
  sms:
    limitKey: "wolf2w:sms:limit:key:"
    codeKey: "wolf2w:sms:code:key:"
logging:
  level:
    xyz.bycor.article.mapper: debug
